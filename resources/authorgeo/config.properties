# Domain configuration for the "authorgeo" validation domain.
# Reference: https://www.itb.ec.europa.eu/docs/guides/latest/validatingRDF/
#
# This defines a single validation type, "author_geo_page", that checks a
# rendered author-website page's JSON-LD (schema.org) against our SHACL
# shapes. Deliberately ONE type for now (SLICE-01/02/03 content model);
# expect this file to grow as the content model does, per the delegation
# brief ("start minimal and correct").

# --- Validation types -------------------------------------------------
validator.type = author_geo_page
validator.typeLabel.author_geo_page = author-geo page

# --- SHACL shapes for the "author_geo_page" type -----------------------
# Path is relative to this config.properties file. If this becomes a
# folder instead of a single file later, the validator will load every
# top-level file in it (see upstream docs on validator.shaclFile.TYPE).
validator.shaclFile.author_geo_page = shapes/author-geo.shacl.ttl

# No externally user-supplied shapes are accepted for this type -- our
# shapes are the sole source of truth. ("none" is the default anyway;
# set explicitly so a future edit can't accidentally loosen this.)
validator.externalShapes.author_geo_page = none

# --- Presentation --------------------------------------------------
validator.uploadTitle = Author-GEO Content Validator

# --- Defaults ------------------------------------------------------
# Default report syntax when a caller's request does not specify one.
# scripts/validate.sh always asks explicitly for application/json, but
# this makes ad-hoc UI/API use sane by default too.
validator.defaultReportSyntax = application/json

# Locale (single-language validator for now).
validator.locale.default = en
