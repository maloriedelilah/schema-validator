services:
  # The SHACL validator (isaitb core + our author-geo domain/shapes).
  # Its JVM truststore trusts the sidecar's self-signed schema.org cert
  # (baked in via Dockerfile), so it can resolve `@context:
  # "https://schema.org"` by fetching from the sidecar over HTTPS.
  schema-validator:
    build:
      context: .
      dockerfile: Dockerfile
    image: schema-validator:authorgeo
    container_name: schema-validator
    ports:
      # Host 4738 -> container 8080 (the validator's fixed internal port).
      # 4738 was picked to avoid colliding with other homelab services;
      # change only the left-hand side if you need a different host port.
      - "4738:8080"
    restart: unless-stopped
    networks:
      - sandbox-egress
    depends_on:
      - schemaorg-context

  # Sidecar: serves the genuine cached schema.org JSON-LD context over HTTPS.
  # The `aliases: [schema.org]` below makes internal DNS on the shared network
  # resolve `schema.org` to THIS container — so when the validator does
  # `GET https://schema.org` to resolve a document's @context, it reaches here
  # (no egress needed). See nginx.conf and README "How it works".
  schemaorg-context:
    build:
      context: .
      dockerfile: Dockerfile.context
    image: schemaorg-context:authorgeo
    container_name: schemaorg-context
    restart: unless-stopped
    networks:
      sandbox-egress:
        aliases:
          - schema.org

networks:
  sandbox-egress:
    external: true
    name: confluence-sandbox-egress
