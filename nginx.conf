# nginx config for the schema.org context sidecar.
#
# The isaitb validator, when it sees `"@context": "https://schema.org"` in an
# input document, does a DIRECT HTTPS GET on that exact URL and expects the
# response BODY to BE the JSON-LD context (it does NOT follow a Link header
# nor append /docs/jsonldcontext.jsonld). So we serve the cached genuine
# schema.org context at the ROOT path, over HTTPS, under the hostname
# schema.org (a Docker network alias points schema.org -> this container).
#
# We serve the SAME context bytes for EVERY request path. This is deliberate:
# the validator controls which URL it GETs (root, /docs/jsonldcontext.jsonld,
# etc.), and every schema.org context URL variant must resolve to the same
# document. There is nothing else on this host, so there is nothing to leak.

server {
    listen 443 ssl;
    server_name schema.org;

    ssl_certificate     /etc/nginx/tls/schemaorg.crt;
    ssl_certificate_key /etc/nginx/tls/schemaorg.key;

    root /usr/share/nginx/context;
    default_type application/ld+json;

    # Map ANY request path to the single cached context file, served as
    # application/ld+json. try_files falls through to the named file for
    # every request.
    location / {
        add_header Content-Type application/ld+json;
        try_files /schemaorg.jsonld =500;
    }
}
